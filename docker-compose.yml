# ─────────────────────────────────────────────────────────────────
# Service On Wheels — Docker Compose
# ─────────────────────────────────────────────────────────────────
# Usage:
#   docker-compose up -d --build       # Build & start all services
#   docker-compose down                # Stop all services
#   docker-compose logs -f backend     # Tail backend logs
# ─────────────────────────────────────────────────────────────────

services:

  # ── MongoDB ──────────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: sow-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Spring Boot Backend ──────────────────────────────────────────
  backend:
    build:
      context: ./backend/service-on-wheels-backend
      dockerfile: Dockerfile
    container_name: sow-backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/service-on-wheels
      - JWT_SECRET=${JWT_SECRET:-my-super-secret-jwt-key-for-local-development-only}
      - JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS:-900000}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - FRONTEND_RESET_URL=${FRONTEND_RESET_URL:-http://localhost/reset-password}
      - APP_LOG_LEVEL=${APP_LOG_LEVEL:-INFO}
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # ── Angular SSR Frontend ─────────────────────────────────────────
  frontend:
    build:
      context: ./customer-app
      dockerfile: Dockerfile
    container_name: sow-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Nginx API Gateway ────────────────────────────────────────────
  api-gateway:
    image: nginx:1.27-alpine
    container_name: sow-gateway
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Redis (Rate Limiting) ────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Prometheus (Metrics) ─────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: sow-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.external-url=/prometheus/'
    ports:
      - "9090:9090"
    depends_on:
      - backend

  # ── Grafana (Dashboards) ─────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: sow-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s:%(http_port)s/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  mongo_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
