spring.application.name=auth-service
server.port=8081

spring.data.mongodb.uri=${MONGODB_URI}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:900000}

logging.level.com.serviceonwheels=${APP_LOG_LEVEL:INFO}
logging.level.org.springframework.security=INFO

# ── Email / SMTP Configuration (Gmail) ─────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Set to false in production if not using a dummy from address
spring.mail.test-connection=false

# ── Frontend URL for password-reset links ───────────────────────
app.frontend.reset-url=${FRONTEND_RESET_URL}

# ── Actuator (health checks, metrics, prometheus) ──────────────────
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never

# ── Redis Configuration ──────────────────────────────────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ── Razorpay Configuration ───────────────────────────────────
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}

# ── Sentry Error Tracking ────────────────────────────────────
sentry.dsn=${SENTRY_DSN:}
sentry.traces-sample-rate=1.0
